set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:RGB"
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -g allow-passthrough on

bind c new-window -c "#{pane_current_path}"
set-option -sg escape-time 10
set-option -g focus-events on

set -g prefix C-a
unbind C-a
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 50000
set -g status-interval 5

set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key -T copy-mode-vi WheelUpPane if-shell -Ft= "#{alternate_on}" "send-keys -M" "select-pane -t=; copy-mode -e; send-keys -N 1 -X scroll-up"
bind-key -T copy-mode-vi WheelDownPane if-shell -Ft= "#{alternate_on}" "send-keys -M" "select-pane -t=; copy-mode -e; send-keys -N 1 -X scroll-down"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

run '~/.tmux/plugins/tpm/tpm'
